spring.application.name=koready

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/koready
spring.datasource.username=koready
spring.datasource.password=${DB_PASSWORD:koready}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 검증 오류 reason은 요청 언어와 상관없이 한국어로 둔다 (요청 언어는 Language로 따로 읽는다)
spring.web.locale=ko
spring.web.locale-resolver=fixed

# 정수 필드에 소수(인원 2.7)가 오면 잘라 받지 않고 400으로 거절한다 (Jackson 기본값은 잘라서 2로 받는다)
spring.jackson.deserialization.accept-float-as-int=false

# 여행 조건: 최대 일수·인원
koready.trip.max-days=10
koready.trip.max-party-size=10

# 장소 후보: 순위 점수 = 인기도 신호 개수 × signal-weight-m − 숙소 직선거리(m), 숙소 가까움 태그 기준 거리(m)
koready.candidate.signal-weight-m=3000
koready.candidate.near-stay-m=1000
# 권장 장소 수 = 일수 × 하루 최소~최대, 하루 최대 장소 수 (잠정)
koready.candidate.recommended-min-per-day=3
koready.candidate.recommended-max-per-day=5
koready.candidate.max-per-day=6

# =======================================================
# 인증(Auth) 관련 설정 (JWT & OAuth)
# =======================================================

# 1. JWT 설정 (환경 변수 JWT_SECRET 사용, 없을 시 기본값 사용)
jwt.secret=${JWT_SECRET:default-secret-key-replace-in-production-over-256-bits}
jwt.access-token-validity-in-seconds=3600
jwt.refresh-token-validity-in-seconds=1209600

# 2. OAuth2 - Google 로그인 설정 (환경 변수 사용)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:default-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# 3. OAuth2 - Apple 로그인 설정 (환경 변수 사용)
oauth2.apple.client-id=${APPLE_CLIENT_ID:default-apple-client-id}
oauth2.apple.team-id=${APPLE_TEAM_ID:default-apple-team-id}
oauth2.apple.key-id=${APPLE_KEY_ID:default-apple-key-id}
oauth2.apple.private-key-path=classpath:apple/AuthKey_${APPLE_KEY_ID:default-apple-key-id}.p8
# 네이버 클라우드 Maps (Geocoding·Reverse Geocoding). 키는 환경변수로만 받는다 (없으면 서버는 뜨고 호출이 502로 실패한다)
koready.naver-maps.base-url=https://maps.apigw.ntruss.com
koready.naver-maps.client-id=${NCP_MAPS_CLIENT_ID:}
koready.naver-maps.client-secret=${NCP_MAPS_CLIENT_SECRET:}
koready.naver-maps.connect-timeout=2s
koready.naver-maps.read-timeout=3s
# 네이버 지역 검색 (NAVER API HUB, 주소·장소명 검색의 장소 결과). Maps와 앱·키가 다르다. 키는 환경변수로만 받는다 (없으면 서버는 뜨고 호출이 502로 실패한다)
koready.naver-search.base-url=https://naverapihub.apigw.ntruss.com
koready.naver-search.client-id=${NCP_APIHUB_CLIENT_ID:}
koready.naver-search.client-secret=${NCP_APIHUB_CLIENT_SECRET:}
koready.naver-search.connect-timeout=2s
koready.naver-search.read-timeout=3s

# 동선 계산: 숙소 출발 시각이 없을 때 하루 시작, 이동 구간을 좌표로 추정할 때의 값 (직선거리 1000m 이하면 도보, 넘으면 대중교통)
koready.route.day-start=09:00
# 동선 만들기에서 숙소에 돌아와야 하는 시각 (넘기면 그 장소는 다른 날로 옮기거나 넣지 못한다)
koready.route.day-end=21:00
koready.route.walk-max-distance-m=1000
koready.route.detour-factor=1.3
koready.route.walk-meters-per-minute=67
koready.route.transit-meters-per-minute=333
koready.route.transit-wait-minutes=10
# 연관 엔티티(일정 항목의 장소·분류 등)를 한 번에 읽어 오는 묶음 크기
spring.jpa.properties.hibernate.default_batch_fetch_size=100
