spring.application.name=koready

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/koready
spring.datasource.username=koready
spring.datasource.password=${DB_PASSWORD:koready}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 검증 오류 reason은 요청 언어와 상관없이 한국어로 둔다 (요청 언어는 Language로 따로 읽는다)
spring.web.locale=ko
spring.web.locale-resolver=fixed

# 정수 필드에 소수(인원 2.7)가 오면 잘라 받지 않고 400으로 거절한다 (Jackson 기본값은 잘라서 2로 받는다)
spring.jackson.deserialization.accept-float-as-int=false

# 여행 조건: 최대 일수·인원
koready.trip.max-days=10
koready.trip.max-party-size=10

# 장소 후보: 순위 점수 = 인기도 신호 개수 × signal-weight-m − 숙소 직선거리(m), 숙소 가까움 태그 기준 거리(m)
koready.candidate.signal-weight-m=3000
koready.candidate.near-stay-m=1000
# 권장 장소 수 = 일수 × 하루 최소~최대, 하루 최대 장소 수 (잠정)
koready.candidate.recommended-min-per-day=3
koready.candidate.recommended-max-per-day=5
koready.candidate.max-per-day=6

# 네이버 클라우드 Maps (Geocoding·Reverse Geocoding). 키는 환경변수로만 받는다 (없으면 서버는 뜨고 호출이 502로 실패한다)
koready.naver-maps.base-url=https://maps.apigw.ntruss.com
koready.naver-maps.client-id=${NCP_MAPS_CLIENT_ID:}
koready.naver-maps.client-secret=${NCP_MAPS_CLIENT_SECRET:}
koready.naver-maps.connect-timeout=2s
koready.naver-maps.read-timeout=3s
